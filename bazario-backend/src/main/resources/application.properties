server.port=${PORT:8081}

# PostgreSQL — defaults work for local dev; override with env vars on Railway
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bazariodb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT — override JWT_SECRET with a strong random value in production
jwt.secret=${JWT_SECRET:iZhwKJ/9w6ULVig5qBApYb3xMuUx9B+QwPd970ryqWM=}
jwt.access-token-expiration-ms=28800000
jwt.refresh-token-expiration-ms=604800000

# File upload
upload.dir=${UPLOAD_DIR:./uploads}

# Multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Encoding — force UTF-8 on all HTTP responses
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Logging
logging.level.com.bazario=INFO
